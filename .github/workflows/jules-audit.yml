name: Jules Repository Audit

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      audit_scope:
        description: 'Audit scope for inspection and improvement'
        required: true
        type: choice
        default: 'full'
        options:
          - 'full'
          - 'bugs'
          - 'tests'
          - 'security'
          - 'code-quality'
          - 'documentation'
      force_audit:
        description: 'Bypass deduplication check and force new audit session'
        required: false
        type: boolean
        default: false

concurrency:
  group: jules-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-repository:
    name: Autonomous Audit with Google Jules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Execute Jules Audit
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_SCOPE: ${{ inputs.audit_scope || 'full' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          FORCE_AUDIT: ${{ inputs.force_audit || 'false' }}
        run: node .github/scripts/run-audit.mjs
