name: Jules CI Failure Repair

on:
  workflow_run:
    workflows:
      - 'Backend CI Pipeline'
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Specific failed GitHub Actions workflow run ID to investigate'
        required: true
        type: string

concurrency:
  group: jules-fix-ci-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  repair-ci-failure:
    name: Investigate and Repair with Google Jules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Process only if:
    # 1. Triggered manually via workflow_dispatch, OR
    # 2. workflow_run completed with failure on default branch in the same repository
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == (github.event.repository.default_branch || 'main') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.name == 'Backend CI Pipeline'
      )

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Investigate CI Failure and Create Jules Session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.run_id) }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node .github/scripts/run-fix-ci.mjs
