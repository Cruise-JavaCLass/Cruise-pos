name: Jules CI Failure Repair

on:
  workflow_run:
    workflows:
      - 'Android CI Pipeline'
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Specific failed GitHub Actions workflow run ID to investigate'
        required: true
        type: string

concurrency:
  group: jules-fix-ci-pos-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  repair-ci-failure:
    name: Investigate and Repair with Google Jules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Process only if:
    # 1. Triggered manually via workflow_dispatch, OR
    # 2. workflow_run completed with failure on default branch for Android CI Pipeline
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == (github.event.repository.default_branch || 'main') &&
        github.event.workflow_run.name == 'Android CI Pipeline'
      )

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Investigate CI Failure and Create Jules Session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.run_id) }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: node .github/scripts/run-fix-ci.mjs
